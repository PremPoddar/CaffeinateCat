.fade{animation:fadeUp .8s ease both}.f1{animation-delay:.08s}.f2{animation-delay:.16s}.f3{animation-delay:.24s}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

@keyframes rise{0%{opacity:0;transform:translateY(12px)}40%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.z{font-family:var(--display);font-weight:700;fill:var(--accent);animation:zz 3s ease-in-out infinite;opacity:0}.z1{font-size:16px}.z2{font-size:20px;animation-delay:.6s}.z3{font-size:26px;animation-delay:1.2s}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
